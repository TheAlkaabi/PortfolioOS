dialog textarea{width:100%;height:240px;font:12px monospace}

</style></head>

<div class="grp"><button type="button" id="copy">Copy HTML</button><button type="button" id="dl" class="pri">Download site</button></div></header>
<div class="tabs"><button type="button" id="te" aria-pressed="true">Edit</button><button type="button" id="tp" aria-pressed="false">Preview</button></div>
<div class="ws"><div id="ed" tabindex="-1"></div>
